# ═══════════════════════════════════════════════════════════════════════════════
# MuhafizSRE: Autonomous Incident Guardian
# Cloud Build Configuration — Google Cloud Run Deployment
# ═══════════════════════════════════════════════════════════════════════════════
#
# This pipeline:
#   1. Builds the Docker image using the multi-stage Dockerfile
#   2. Pushes to Google Container Registry (GCR)
#   3. Deploys to Cloud Run with IAM bindings and secret management
#
# Prerequisites:
#   - Enable Cloud Build, Cloud Run, and Secret Manager APIs
#   - Create secrets: gemini-api-key, muhafiz-secret-key
#   - Grant Cloud Build SA the roles:
#     roles/run.admin, roles/iam.serviceAccountUser, roles/secretmanager.secretAccessor
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml .
# ═══════════════════════════════════════════════════════════════════════════════

steps:
  # ─── Step 1: Build the container image ────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/muhafizsre:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/muhafizsre:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/muhafizsre:latest'
      - '.'

  # ─── Step 2: Push to Container Registry ───────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/muhafizsre:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/muhafizsre:latest']

  # ─── Step 3: Deploy to Cloud Run ──────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'muhafizsre-gateway'
      - '--image'
      - 'gcr.io/$PROJECT_ID/muhafizsre:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'  # Demo only; production would use IAM auth
      # IAM service account for the Cloud Run instance
      - '--service-account'
      - 'muhafizsre-runner@$PROJECT_ID.iam.gserviceaccount.com'
      # Secret management — inject API keys securely
      - '--set-secrets'
      - 'GEMINI_API_KEY=gemini-api-key:latest,MUHAFIZ_APPROVAL_SECRET=muhafiz-secret-key:latest'
      # Resource allocation
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      - '--timeout'
      - '300s'

# Container images to store in GCR
images:
  - 'gcr.io/$PROJECT_ID/muhafizsre:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/muhafizsre:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Build timeout (10 minutes)
timeout: '600s'
